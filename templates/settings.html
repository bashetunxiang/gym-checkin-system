{% extends "base.html" %}
{% block content %}
<div class="stats-grid">
  <article class="stat-card">
    <span>当前账号</span>
    <strong id="settingUsername">-</strong>
  </article>
  <article class="stat-card">
    <span>人员数量</span>
    <strong id="settingPersonCount">0</strong>
  </article>
  <article class="stat-card">
    <span>记录数量</span>
    <strong id="settingRecordCount">0</strong>
  </article>
  <article class="stat-card">
    <span>数据目录</span>
    <strong>data</strong>
  </article>
</div>

<section class="panel security-panel">
  <div class="panel-header">
    <div>
      <p class="eyebrow">账户安全</p>
      <h2>修改密码</h2>
    </div>
  </div>
  {% if session.get('must_change_password') %}
  <div class="notice-banner">你当前使用的是初始密码，请立即设置新密码。</div>
  {% endif %}
  <form id="changePasswordForm" class="form-grid compact-form">
    <label>
      <span>当前密码</span>
      <input name="current_password" type="password" autocomplete="current-password" required>
    </label>
    <label>
      <span>新密码（至少 8 位）</span>
      <input name="new_password" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <label>
      <span>确认新密码</span>
      <input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
    </label>
    <button type="submit">保存新密码</button>
    <p id="changePasswordMessage" class="form-message"></p>
  </form>
</section>

<section class="panel">
  <div class="panel-header">
    <h2>数据文件状态</h2>
    <button class="small-button" id="refreshSettings">刷新</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>文件</th>
          <th>路径</th>
          <th>是否存在</th>
          <th>大小</th>
        </tr>
      </thead>
      <tbody id="settingsRows"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>initSettingsPage();</script>
{% endblock %}
