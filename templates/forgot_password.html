<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码 - 体育馆视频打卡管理系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=8">
</head>
<body class="login-page">
  {% include "_time_sky.html" %}
  <main class="login-layout">
    <section class="login-hero">
      <p class="eyebrow">Password recovery</p>
      <h1>找回密码</h1>
      <p>输入注册时保存的初始密码，通过验证后即可设置新密码。初始密码不会在页面中再次显示。</p>
    </section>
    <form id="forgotPasswordForm" class="login-panel">
      <h2>重置密码</h2>
      <label>
        <span>账号</span>
        <input name="username" autocomplete="username" required>
      </label>
      <label>
        <span>初始密码</span>
        <input name="initial_password" type="password" autocomplete="off" required>
      </label>
      <label>
        <span>新密码（至少 8 位）</span>
        <input name="new_password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <label>
        <span>确认新密码</span>
        <input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
      </label>
      <button type="submit">重置密码</button>
      <p id="forgotPasswordMessage" class="form-message"></p>
      <div class="auth-links single-link">
        <a href="{{ url_for('login_page') }}">返回登录</a>
      </div>
    </form>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=8"></script>
  <script>initForgotPasswordPage();</script>
</body>
</html>
