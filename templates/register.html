<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册账号 - 体育馆视频打卡管理系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=7">
</head>
<body class="login-page">
  {% include "_time_sky.html" %}
  <main class="login-layout">
    <section class="login-hero">
      <p class="eyebrow">Create your account</p>
      <h1>注册新账号</h1>
      <p>构造一个专属账号。注册成功后系统会分配初始密码，请妥善保存，它也是忘记密码时的身份凭证。</p>
    </section>
    <section class="login-panel">
      <form id="registerForm" class="auth-form">
        <h2>账号注册</h2>
        <label>
          <span>自定义账号</span>
          <input name="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" placeholder="3–32 位字母或数字" required>
        </label>
        <button type="submit">生成初始密码</button>
        <p id="registerMessage" class="form-message"></p>
      </form>
      <div id="initialPasswordCard" class="initial-password-card" hidden>
        <span>你的初始密码</span>
        <strong id="initialPassword"></strong>
        <button id="copyInitialPassword" class="secondary" type="button">复制初始密码</button>
        <p>请立即保存。登录后可在“系统设置”中修改密码。</p>
      </div>
      <div class="auth-links single-link">
        <a href="{{ url_for('login_page') }}">返回登录</a>
      </div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/app.js') }}?v=7"></script>
  <script>initRegisterPage();</script>
</body>
</html>
