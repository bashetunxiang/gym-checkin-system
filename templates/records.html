{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-header">
    <h2>全部到馆记录</h2>
    <button class="small-button" id="refreshRecords">刷新</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>第几个进入场馆</th>
          <th>人员编号</th>
          <th>姓名</th>
          <th>进入时间</th>
          <th>离馆时间</th>
          <th>停留时间</th>
          <th>状态</th>
        </tr>
      </thead>
      <tbody id="recordRows"></tbody>
    </table>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>initRecordsPage();</script>
{% endblock %}
