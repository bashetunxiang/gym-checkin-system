<section id="timeSky" class="time-sky" aria-label="当前日期和时间">
  <div class="sky-stars" aria-hidden="true"></div>
  <div class="sky-cloud cloud-one" aria-hidden="true"></div>
  <div class="sky-cloud cloud-two" aria-hidden="true"></div>
  <div id="skyOrb" class="sky-orb" aria-hidden="true"></div>
  <div class="sky-horizon" aria-hidden="true"></div>
  <div class="sky-clock">
    <span id="skyPeriod" class="sky-period">本地时间</span>
    <strong id="skyTime">00:00:00</strong>
    <span id="skyDate">正在读取日期…</span>
  </div>
</section>
